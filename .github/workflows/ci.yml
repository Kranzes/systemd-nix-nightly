name: CI

on:
  push:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.eval.outputs.packages }}
      checks: ${{ steps.eval.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          version: v3.0.1
          upstream-cache-filter: true
      - id: eval
        name: Run nix-eval-jobs
        run: |
          derivations=$(
            nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
              --select 'flake: let inherit (builtins) currentSystem; in {
                # switchTest OOMs on the runner
                checks.${currentSystem} = removeAttrs flake.outputs.checks.${currentSystem} [ "switchTest" ];
                # No need to build rebase-patches in CI
                packages.${currentSystem} = removeAttrs flake.outputs.packages.${currentSystem} [ "rebase-patches" ];
              }' \
              --impure --force-recurse --check-cache-status --flake . | jq -cs 'map({attr, isCached})'
          )
          {
            echo "packages=$(jq -c 'map(select(.attr | startswith("packages.")))' <<< "$derivations")"
            echo "checks=$(jq -c 'map(select(.attr | startswith("checks.")))' <<< "$derivations")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    runs-on: ubuntu-latest
    name: build (${{ matrix.derivation.attr }})
    strategy:
      fail-fast: false
      matrix:
        derivation: ${{ fromJson(needs.eval.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.derivation.isCached }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        if: ${{ !matrix.derivation.isCached }}
        with:
          installer-version: 2.35.1
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        if: ${{ !matrix.derivation.isCached }}
        with:
          version: v3.0.1
          upstream-cache-filter: true
      - run: nix build '.#${{ matrix.derivation.attr }}' -L
        if: ${{ !matrix.derivation.isCached }}

  check:
    needs:
      - eval
      - build
    runs-on: ubuntu-latest
    name: check (${{ matrix.derivation.attr }})
    strategy:
      fail-fast: false
      matrix:
        derivation: ${{ fromJson(needs.eval.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.derivation.isCached }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        if: ${{ !matrix.derivation.isCached }}
        with:
          installer-version: 2.35.1
          # The nspawn container tests set
          # requiredSystemFeatures = [ "uid-range" ].
          extra-conf: |
            auto-allocate-uids = true
            use-cgroups = true
            extra-system-features = uid-range
            extra-experimental-features = auto-allocate-uids cgroups
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        if: ${{ !matrix.derivation.isCached }}
        with:
          version: v3.0.1
          upstream-cache-filter: true
      - run: nix build '.#${{ matrix.derivation.attr }}' -L
        if: ${{ !matrix.derivation.isCached }}
