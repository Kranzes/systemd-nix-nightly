name: Update lon.lock

on:
  schedule:
    # Weekly, Monday midnight (UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - id: lon
        env:
          LON_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          nix run --impure --expr 'import (import ./lon.nix).nixpkgs { }' lon -- bot github
          # lon creates the lon/systemd branch before it checks for an update,
          # so the branch exists either way. Only a real bump moves it off HEAD.
          if git rev-parse --verify -q lon/systemd > /dev/null &&
             [ "$(git rev-parse lon/systemd)" != "$(git rev-parse HEAD)" ]; then
            echo "systemd-updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebase patches onto updated systemd
        if: steps.lon.outputs.systemd-updated == 'true'
        run: |
          git switch lon/systemd
          nix run -f . packages.rebase-patches
          if [ -n "$(git status --porcelain -- patches)" ]; then
            git add patches
            git -c user.name=LonBot -c user.email=lonbot@lonbot \
              commit --amend \
              -m "$(git log -1 --pretty=%B)" \
              -m "patches: rebase onto $(jq -r .sources.systemd.revision lon.lock)"
            git push --force origin lon/systemd
          fi
