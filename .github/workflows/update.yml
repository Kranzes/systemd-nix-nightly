name: Update lon.lock

on:
  schedule:
    # Weekly, Monday midnight (UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - env:
          LON_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name 'kranzes-ci[bot]'
          git config user.email '313948658+kranzes-ci[bot]@users.noreply.github.com'
          # lon exits non-zero when there is nothing to update. The grep lets
          # that case pass and keeps other failures fatal.
          nix run --impure --expr 'import (import ./lon.nix).nixpkgs { }' lon -- update -c 2>&1 |
            tee "$RUNNER_TEMP/lon.log" || grep -q "No updates available" "$RUNNER_TEMP/lon.log"
      - run: |
          nix run -f . packages.rebase-patches
          if [ -n "$(git status --porcelain -- patches)" ]; then
            git add patches
            git commit --amend \
              -m "$(git log -1 --pretty=%B)" \
              -m "patches: rebase onto $(jq -r .sources.systemd.revision lon.lock)"
          fi
          git push origin master
